name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # uses the version in package.json ("packageManager")
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Install strictly from the committed lockfile so CI uses the versions verified locally.
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

      # The API tests run against a real MongoDB; this caches the binary they download.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-v1
      - name: Shared rules and estimate engine
        run: pnpm --filter @roofdesk/shared --filter @roofdesk/estimate-engine test
      - name: API unit and integration tests
        run: pnpm --filter @roofdesk/api test
      - run: pnpm build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      # Fails the run if a production dependency has a known high or critical vulnerability.
      - run: pnpm audit --prod --audit-level=high

  e2e:
    name: Browser tests
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: development
      MONGODB_URI: mongodb://localhost:27017/roofdesk_e2e?replicaSet=rs0
      JWT_ACCESS_SECRET: ci-only-secret-ci-only-secret-ci-only-secret-12
      WEB_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      PAYMENT_PROVIDER: mock
      EMAIL_PROVIDER: log
      STORAGE_DRIVER: local
      STORAGE_DIR: ./storage
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start MongoDB (replica set)
        run: |
          docker compose up -d mongo
          for i in $(seq 1 40); do
            docker compose exec -T mongo mongosh --quiet --eval "rs.status().ok" >/dev/null 2>&1 && break
            sleep 2
          done
      - run: pnpm --filter @roofdesk/web e2e:install
      - run: pnpm --filter @roofdesk/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
