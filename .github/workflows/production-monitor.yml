name: Production monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Check production availability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRODUCTION_URL: https://contractor-portal-wheat.vercel.app
    steps:
      - name: Check website, API liveness, and database readiness
        shell: bash
        run: |
          set -euo pipefail
          base="${PRODUCTION_URL%/}"
          for path in / /api/v1/health /api/v1/ready; do
            url="$base$path"
            status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --connect-timeout 10 --max-time 20 --retry 2 --retry-delay 5 --retry-all-errors "$url")
            if [[ ! "$status" =~ ^2[0-9][0-9]$ ]]; then
              echo "::error title=Production probe failed::$url returned HTTP $status"
              exit 1
            fi
            echo "OK $path (HTTP $status)"
          done
