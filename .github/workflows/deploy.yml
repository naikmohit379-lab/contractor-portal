name: Deploy

# Builds the two images and, after a person approves, updates the production server.
# Set up the "production" environment in GitHub (Settings > Environments) with required reviewers.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  images:
    name: Build and publish images
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: meta
        run: echo "tag=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/api:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api/v1
            NEXT_PUBLIC_SITE_URL=https://${{ vars.DOMAIN }}
          tags: ${{ env.IMAGE_PREFIX }}/web:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Deploy to production
    needs: images
    runs-on: ubuntu-latest
    environment: production # waits here for approval when required reviewers are set
    steps:
      - name: Update the server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: NEW_TAG,GHCR_USER,GHCR_TOKEN
          script_stop: true
          script: |
            cd /opt/roofdesk
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            PREVIOUS=$(grep '^TAG=' .env | cut -d= -f2)
            echo "$PREVIOUS" > .previous-tag
            sed -i "s/^TAG=.*/TAG=$NEW_TAG/" .env
            docker compose -f docker-compose.prod.yml pull api web
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
        env:
          NEW_TAG: ${{ needs.images.outputs.tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}

      - name: Check the new version is up
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "https://${{ vars.DOMAIN }}/ready" >/dev/null; then echo "ready"; exit 0; fi
            sleep 5
          done
          echo "The new version did not become ready"; exit 1

      - name: Roll back to the previous version
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/roofdesk
            [ -f .previous-tag ] || exit 0
            sed -i "s/^TAG=.*/TAG=$(cat .previous-tag)/" .env
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
